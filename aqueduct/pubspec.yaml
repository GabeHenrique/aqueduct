name: aqueduct
version: 4.0.0-b1
description: A modern HTTP server application framework, ORM and OAuth2 provider with OpenAPI 3.0 integration. Foundation for REST, RPC or GraphQL services.
homepage: https://aqueduct.io
documentation:

environment:
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  args: ^2.0.0
  analyzer: ^5.0.0
  crypto: ^3.0.0
  logging: ^1.0.0
  # isolate_executor: ^2.0.0  # May need replacement
  meta: ^1.8.0
  # open_api: ^2.0.1  # May need replacement
  # password_hash: ^2.0.0  # May need replacement  
  path: ^1.8.0
  postgres: ^2.6.0
  # pub_cache: '>=0.2.0 <0.3.0'  # May need replacement
  # pub_semver: ^2.0.0  # May need replacement
  # safe_config: ^3.0.0-b2  # Doesn't support null safety
  yaml: ^3.1.0
  # runtime: ^1.0.0-9  # Doesn't support null safety

dev_dependencies:
  matcher: ^0.12.16
  test: ^1.24.6
  http: ^1.1.0
  # command_line_agent: ^1.0.0-b2  # Temporarily removed - doesn't support null safety
  aqueduct_test:
    path: ../aqueduct_test

executables:
  aqueduct: aqueduct