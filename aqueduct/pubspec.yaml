name: aqueduct
version: 4.0.0-b1
description: A modern HTTP server application framework, ORM and OAuth2 provider with OpenAPI 3.0 integration. Foundation for REST, RPC or GraphQL services.
homepage: https://aqueduct.io
documentation:

environment:
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  args: ^2.7.0
  analyzer: ^8.1.1
  crypto: ^3.0.6
  logging: ^1.3.0
  # isolate_executor: ^2.0.0  # Doesn't support null safety yet
  meta: ^1.17.0
  # open_api: ^2.0.1  # Check if this supports null safety
  # password_hash: any  # Doesn't support null safety
  path: ^1.9.1
  postgres: ^3.0.0
  # pub_cache: '>=0.2.0 <0.3.0'  # Check if this supports null safety
  pub_semver: ^2.2.0
  # safe_config: ^3.0.0-b2  # Doesn't support null safety
  yaml: ^3.1.3
  # runtime: ^1.0.0-9  # Doesn't support null safety

dev_dependencies:
  matcher: ^0.12.17
  test: ^1.26.3
  http: ^1.5.0
  # command_line_agent: ^1.0.0-b2  # Doesn't support null safety
  aqueduct_test:
    path: ../aqueduct_test

executables:
  aqueduct: aqueduct